<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>چت با پشتیبان</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e8edf5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin: 0;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            overflow: hidden;
            height: 700px;
            display: flex;
            flex-direction: column;
        }

        /* هدر */
        .chat-header {
            background: #2b3b4e;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e2a36;
            flex-shrink: 0;
        }
        .chat-header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #8b5cf6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }
        .chat-header .user-details h3 {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }
        .chat-header .user-details span {
            color: #8aa3bc;
            font-size: 12px;
        }
        .chat-header .status {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .chat-header .status span {
            color: #8aa3bc;
            font-size: 12px;
        }
        .btn-logout {
            background: #e74c5e;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .btn-logout:hover {
            background: #c0392b;
        }

        /* باکس چت */
        .chat-box {
            flex: 1;
            padding: 16px 18px;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* پیام‌ها */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: fadeIn 0.25s ease;
        }
        .message-wrapper.sent {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message-wrapper.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-bubble {
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
        }
        .message-wrapper.sent .message-bubble {
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-wrapper.received .message-bubble {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message-wrapper.received .message-bubble.admin-msg {
            background: #ede9fe;
            border-color: #c4b5fd;
        }

        .message-time {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
            padding: 0 4px;
        }
        .message-wrapper.sent .message-time {
            color: #94a3b8;
        }

        .message-sender {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 2px;
            padding: 0 4px;
        }
        .message-wrapper.sent .message-sender {
            color: #93b5f0;
        }
        .message-wrapper.received .message-sender {
            color: #8b5cf6;
        }

        .date-divider {
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
            padding: 10px 0 6px;
            position: relative;
        }
        .date-divider span {
            background: #f8fafc;
            padding: 0 14px;
            position: relative;
            z-index: 1;
            font-size: 12px;
            color: #64748b;
        }
        .date-divider::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: #e2e8f0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ورودی پیام */
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 12px 18px 16px;
            background: white;
            border-top: 1px solid #e2e8f0;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #f8fafc;
            font-family: inherit;
        }
        .chat-input-area input:focus {
            border-color: #3b82f6;
            background: white;
        }
        .chat-input-area .btn-send {
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            flex-shrink: 0;
        }
        .chat-input-area .btn-send:hover {
            background: #2563eb;
            transform: scale(0.97);
        }

        /* صفحه ورود */
        .login-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 30px;
        }
        .login-container h1 {
            font-size: 28px;
            color: #1e293b;
            text-align: center;
            margin-bottom: 6px;
        }
        .login-container .sub {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .login-container .form-group {
            margin-bottom: 16px;
        }
        .login-container label {
            display: block;
            font-weight: 500;
            color: #0f172a;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .login-container input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            font-size: 15px;
            background: #f8fafc;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .login-container input:focus {
            border-color: #3b82f6;
            background: white;
        }
        .login-container .btn-login {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            font-family: inherit;
        }
        .login-container .btn-login:hover {
            background: #2563eb;
        }
        .login-container .error-msg {
            color: #b91c1c;
            background: #fee2e2;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        .login-container .footer-note {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 20px;
        }
        .hidden {
            display: none !important;
        }

        .empty-chat {
            text-align: center;
            color: #94a3b8;
            padding: 50px 20px;
            font-size: 14px;
        }
        .empty-chat .empty-icon {
            font-size: 52px;
            margin-bottom: 14px;
            display: block;
        }
        .empty-chat .empty-sub {
            font-size: 12px;
            color: #cbd5e1;
            margin-top: 4px;
        }

        /* پیام جدید */
        .new-msg-indicator {
            text-align: center;
            font-size: 11px;
            color: #3b82f6;
            padding: 4px 0;
            font-weight: 500;
        }

        @media (max-width: 500px) {
            .container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            .chat-header {
                padding: 12px 16px;
            }
            .chat-box {
                padding: 12px 14px;
            }
            .chat-input-area {
                padding: 10px 14px 14px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- صفحه ورود -->
    <div id="loginPage" class="login-container">
        <h1>💬 چت با پشتیبان</h1>
        <p class="sub">نام خود را وارد کنید</p>
        <div class="form-group">
            <label>نام شما</label>
            <input type="text" id="userNameInput" placeholder="نام خود را وارد کنید" maxlength="30" />
        </div>
        <button class="btn-login" id="enterBtn">ورود</button>
        <div id="loginError" class="error-msg hidden"></div>
        <div class="footer-note">🔒 پیام‌ها در مرورگر ذخیره می‌شوند</div>
    </div>

    <!-- صفحه چت -->
    <div id="chatPage" class="hidden" style="height:100%;display:flex;flex-direction:column;">
        <!-- هدر -->
        <div class="chat-header">
            <div class="user-info">
                <div class="avatar" id="userAvatar">👤</div>
                <div class="user-details">
                    <h3>پشتیبان</h3>
                    <span id="userStatus">آنلاین</span>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="status">
                    <span class="dot"></span>
                    <span>آنلاین</span>
                </div>
                <button class="btn-logout" id="logoutBtn">خروج</button>
            </div>
        </div>

        <!-- باکس چت -->
        <div class="chat-box" id="chatBox">
            <div class="empty-chat">
                <span class="empty-icon">💬</span>
                <p>به پشتیبان پیام دهید</p>
                <div class="empty-sub">پاسخ شما در اسرع وقت داده می‌شود</div>
            </div>
        </div>

        <!-- ورودی پیام -->
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." maxlength="500" />
            <button class="btn-send" id="sendBtn">ارسال</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const STORAGE_KEY = 'chat_data';
        const USER_KEY = 'chat_user';

        function loadMessages() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch { return []; }
        }

        function saveMessages(messages) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        }

        // کاربر فقط با مدیر چت می‌کند (isAdmin = true)
        function addMessage(sender, text) {
            const messages = loadMessages();
            messages.push({
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                sender: sender.trim(),
                text: text.trim(),
                timestamp: new Date().toISOString(),
                timeDisplay: new Date().toLocaleString('fa-IR'),
                isAdmin: false
            });
            saveMessages(messages);
            return messages;
        }

        // ====== عناصر DOM ======
        const loginPage = document.getElementById('loginPage');
        const chatPage = document.getElementById('chatPage');
        const userNameInput = document.getElementById('userNameInput');
        const enterBtn = document.getElementById('enterBtn');
        const loginError = document.getElementById('loginError');
        const userAvatar = document.getElementById('userAvatar');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userStatus = document.getElementById('userStatus');

        let currentUser = '';

        // ====== توابع کمکی ======
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(element, msg) {
            element.textContent = msg;
            element.classList.remove('hidden');
            setTimeout(() => {
                element.classList.add('hidden');
            }, 4000);
        }

        function getInitials(name) {
            if (!name) return '👤';
            return name.charAt(0).toUpperCase();
        }

        function getColorFromName(name) {
            const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#22c55e', '#ef4444', '#14b8a6', '#f97316'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function isToday(date) {
            const today = new Date();
            return date.getDate() === today.getDate() &&
                   date.getMonth() === today.getMonth() &&
                   date.getFullYear() === today.getFullYear();
        }

        function formatDate(date) {
            const d = new Date(date);
            if (isToday(d)) return 'امروز';
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            if (d.getDate() === yesterday.getDate() &&
                d.getMonth() === yesterday.getMonth() &&
                d.getFullYear() === yesterday.getFullYear()) {
                return 'دیروز';
            }
            return d.toLocaleDateString('fa-IR');
        }

        // ====== رندر پیام‌ها ======
        function renderMessages() {
            const messages = loadMessages();
            
            // فقط پیام‌های مربوط به این کاربر و مدیر
            const filtered = messages.filter(msg => {
                return msg.sender === currentUser || msg.isAdmin === true;
            });

            chatBox.innerHTML = '';

            if (filtered.length === 0) {
                chatBox.innerHTML = `
                    <div class="empty-chat">
                        <span class="empty-icon">💬</span>
                        <p>به پشتیبان پیام دهید</p>
                        <div class="empty-sub">پاسخ شما در اسرع وقت داده می‌شود</div>
                    </div>
                `;
                return;
            }

            let lastDate = '';

            filtered.forEach(msg => {
                const msgDate = new Date(msg.timestamp);
                const dateStr = formatDate(msgDate);
                const timeStr = msgDate.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

                if (dateStr !== lastDate) {
                    lastDate = dateStr;
                    const divider = document.createElement('div');
                    divider.className = 'date-divider';
                    divider.innerHTML = `<span>${dateStr}</span>`;
                    chatBox.appendChild(divider);
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper';

                const isOwn = msg.sender === currentUser;
                const isAdmin = msg.isAdmin;

                if (isOwn) {
                    wrapper.classList.add('sent');
                } else {
                    wrapper.classList.add('received');
                }

                const senderName = document.createElement('div');
                senderName.className = 'message-sender';
                if (isAdmin) {
                    senderName.textContent = '🛡️ پشتیبان';
                } else if (isOwn) {
                    senderName.textContent = 'شما';
                } else {
                    senderName.textContent = msg.sender;
                }
                wrapper.appendChild(senderName);

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                if (isAdmin) {
                    bubble.classList.add('admin-msg');
                }
                bubble.textContent = msg.text;
                wrapper.appendChild(bubble);

                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = timeStr;
                wrapper.appendChild(time);

                chatBox.appendChild(wrapper);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ====== ورود به چت ======
        function enterChat() {
            loginPage.classList.add('hidden');
            chatPage.classList.remove('hidden');
            chatPage.style.display = 'flex';
            
            userAvatar.textContent = getInitials(currentUser);
            userAvatar.style.background = getColorFromName(currentUser);
            userStatus.textContent = 'آنلاین';
            
            renderMessages();
            messageInput.value = '';
            messageInput.focus();
        }

        // ====== لاگین ======
        function handleLogin() {
            const name = userNameInput.value.trim();
            if (!name) {
                showError(loginError, 'لطفاً نام خود را وارد کنید');
                return;
            }
            if (name.length < 2) {
                showError(loginError, 'نام باید حداقل ۲ حرف باشد');
                return;
            }
            // بررسی اینکه اسم تکراری نباشد
            const messages = loadMessages();
            const existingUsers = new Set();
            messages.forEach(msg => {
                if (!msg.isAdmin) {
                    existingUsers.add(msg.sender);
                }
            });
            if (existingUsers.has(name) && name !== localStorage.getItem(USER_KEY)) {
                showError(loginError, 'این نام قبلاً ثبت شده است. نام دیگری انتخاب کنید');
                return;
            }

            currentUser = name;
            localStorage.setItem(USER_KEY, name);
            enterChat();
        }

        // ====== ارسال پیام ======
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage(currentUser, text);
            renderMessages();
            messageInput.value = '';
            messageInput.focus();
        }

        // ====== خروج ======
        function logout() {
            if (confirm('آیا مطمئن هستید؟')) {
                localStorage.removeItem(USER_KEY);
                currentUser = '';
                chatPage.style.display = 'none';
                chatPage.classList.add('hidden');
                loginPage.classList.remove('hidden');
                userNameInput.value = '';
                chatBox.innerHTML = '';
                messageInput.value = '';
            }
        }

        // ====== چک کردن کاربر ذخیره شده ======
        function checkSavedUser() {
            const saved = localStorage.getItem(USER_KEY);
            if (saved) {
                userNameInput.value = saved;
                currentUser = saved;
                enterChat();
            }
        }

        // ====== رویدادها ======
        enterBtn.addEventListener('click', handleLogin);
        userNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        logoutBtn.addEventListener('click', logout);

        // ====== به‌روزرسانی خودکار ======
        setInterval(() => {
            if (!chatPage.classList.contains('hidden') && chatPage.style.display !== 'none') {
                renderMessages();
            }
        }, 3000);

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                if (!chatPage.classList.contains('hidden') && chatPage.style.display !== 'none') {
                    renderMessages();
                }
            }
        });

        // ====== شروع ======
        checkSavedUser();
    })();
</script>
</body>
</html>
