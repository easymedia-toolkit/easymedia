<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>مدیریت</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 24px 20px 30px;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f1f5f9;
            text-align: center;
            margin-bottom: 8px;
        }
        .sub {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 22px;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #334155;
            border-radius: 18px;
            font-size: 1rem;
            background: #0f172a;
            color: #f1f5f9;
            transition: 0.2s;
            outline: none;
            font-family: inherit;
        }
        input:focus {
            border-color: #3b82f6;
            background: #1e293b;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }
        input::placeholder {
            color: #64748b;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            font-family: inherit;
        }
        .btn:hover {
            background: #2563eb;
            transform: scale(0.98);
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-outline {
            background: transparent;
            color: #3b82f6;
            border: 2px solid #3b82f6;
        }
        .btn-outline:hover {
            background: #3b82f6;
            color: white;
        }
        .btn-warning {
            background: #f59e0b;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        .hidden {
            display: none !important;
        }
        .chat-box {
            background: #0f172a;
            border-radius: 24px;
            padding: 12px 8px;
            margin: 18px 0 12px;
            max-height: 420px;
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .message {
            padding: 10px 14px;
            margin: 6px 8px;
            border-radius: 20px;
            max-width: 88%;
            word-wrap: break-word;
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
        }
        .message.admin {
            background: #1e3a5f;
            border-color: #3b82f6;
            margin-right: auto;
            border-bottom-right-radius: 6px;
        }
        .message.user {
            background: #2d3748;
            border-color: #4a5568;
            margin-left: auto;
            border-bottom-left-radius: 6px;
        }
        .msg-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 6px;
            gap: 12px;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
            margin: 10px 0 6px;
        }
        .chat-input-area input {
            flex: 1;
            border-radius: 40px;
        }
        .chat-input-area .btn {
            width: auto;
            padding: 0 22px;
            border-radius: 40px;
            margin-top: 0;
        }
        .error-msg {
            color: #fca5a5;
            background: #7f1d1d;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 0.9rem;
            margin: 6px 0;
            border: 1px solid #991b1b;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-bar h2 {
            font-size: 1.3rem;
            color: #f1f5f9;
        }
        .footer-note {
            text-align: center;
            color: #64748b;
            font-size: 0.75rem;
            margin-top: 14px;
            border-top: 1px solid #334155;
            padding-top: 14px;
        }
        .badge {
            background: #334155;
            color: #e2e8f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .action-buttons .btn {
            flex: 1;
            min-width: 100px;
        }
        @media (max-width: 480px) {
            .container { padding: 18px 12px; }
            .chat-input-area { flex-wrap: wrap; }
            .chat-input-area input { flex: 1 1 100%; }
            .action-buttons .btn { min-width: 80px; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- صفحه ورود -->
    <div id="loginPage">
        <h1>🔐 ورود</h1>
        <p class="sub">نام کاربری و رمز عبور را وارد کنید</p>
        <div class="form-group">
            <label>نام کاربری</label>
            <input type="text" id="usernameInput" placeholder="نام کاربری" />
        </div>
        <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" id="passwordInput" placeholder="رمز عبور" />
        </div>
        <button class="btn" id="loginBtn">ورود</button>
        <div id="loginError" class="error-msg hidden"></div>
        <div class="footer-note">🔒 دسترسی محدود</div>
    </div>

    <!-- صفحه مدیریت -->
    <div id="panelPage" class="hidden">
        <div class="header-bar">
            <h2>🛡️ مدیریت</h2>
            <button class="btn btn-danger" id="logoutBtn" style="width:auto; padding:6px 18px; font-size:0.8rem;">خروج</button>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;">
            <span class="badge">📊 پیام‌ها: <span id="messageCount">0</span></span>
            <span class="badge">👥 کاربران: <span id="userCount">0</span></span>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." maxlength="500" />
            <button class="btn" id="sendBtn">ارسال</button>
        </div>
        <div id="chatError" class="error-msg hidden"></div>
        <div class="action-buttons">
            <button class="btn btn-warning" id="clearBtn">🗑 پاک کردن همه</button>
            <button class="btn btn-outline" id="refreshBtn">🔄 به‌روزرسانی</button>
        </div>
        <div class="footer-note">✅ پیام‌های شما ذخیره می‌شود</div>
    </div>
</div>

<script>
    (function() {
        const STORAGE_KEY = 'chat_data';
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = '1234';

        function loadMessages() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch { return []; }
        }

        function saveMessages(messages) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        }

        function addAdminMessage(text) {
            const messages = loadMessages();
            messages.push({
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                sender: 'مدیر',
                text: text.trim(),
                timestamp: new Date().toLocaleString('fa-IR'),
                isAdmin: true
            });
            saveMessages(messages);
            return messages;
        }

        function clearAllMessages() {
            localStorage.removeItem(STORAGE_KEY);
        }

        const loginPage = document.getElementById('loginPage');
        const panelPage = document.getElementById('panelPage');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const chatError = document.getElementById('chatError');
        const clearBtn = document.getElementById('clearBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const messageCount = document.getElementById('messageCount');
        const userCount = document.getElementById('userCount');

        let isLoggedIn = false;

        function showError(element, msg) {
            element.textContent = msg;
            element.classList.remove('hidden');
            setTimeout(() => {
                element.classList.add('hidden');
            }, 4000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getUniqueUsers(messages) {
            const users = new Set();
            messages.forEach(msg => {
                if (!msg.isAdmin) {
                    users.add(msg.sender);
                }
            });
            return users;
        }

        function updateStats() {
            const messages = loadMessages();
            messageCount.textContent = messages.length;
            const users = getUniqueUsers(messages);
            userCount.textContent = users.size;
        }

        function renderMessages() {
            const messages = loadMessages();
            chatBox.innerHTML = '';
            if (messages.length === 0) {
                chatBox.innerHTML = '<div style="text-align:center;color:#64748b;padding:20px;">هیچ پیامی وجود ندارد</div>';
                return;
            }
            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message';
                if (msg.isAdmin) {
                    div.classList.add('admin');
                } else {
                    div.classList.add('user');
                }
                let senderDisplay = msg.isAdmin ? '🛡️ شما (مدیر)' : `👤 ${msg.sender}`;
                div.innerHTML = `
                    <div><strong>${senderDisplay}</strong></div>
                    <div>${escapeHtml(msg.text)}</div>
                    <div class="msg-meta"><span>${msg.timestamp}</span></div>
                `;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
            updateStats();
        }

        function handleLogin() {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                isLoggedIn = true;
                loginPage.classList.add('hidden');
                panelPage.classList.remove('hidden');
                renderMessages();
                messageInput.value = '';
                loginError.classList.add('hidden');
                usernameInput.value = '';
                passwordInput.value = '';
            } else {
                showError(loginError, 'نام کاربری یا رمز عبور اشتباه است');
            }
        }

        function sendMessage() {
            if (!isLoggedIn) return;
            const text = messageInput.value.trim();
            if (!text) {
                showError(chatError, 'لطفاً متن پیام را وارد کنید');
                return;
            }
            addAdminMessage(text);
            renderMessages();
            messageInput.value = '';
            chatError.classList.add('hidden');
        }

        function logout() {
            if (confirm('آیا مطمئن هستید؟')) {
                isLoggedIn = false;
                panelPage.classList.add('hidden');
                loginPage.classList.remove('hidden');
                chatBox.innerHTML = '';
                messageInput.value = '';
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        logoutBtn.addEventListener('click', logout);

        clearBtn.addEventListener('click', () => {
            if (confirm('⚠️ همه پیام‌ها پاک می‌شوند! ادامه؟')) {
                clearAllMessages();
                renderMessages();
            }
        });

        refreshBtn.addEventListener('click', renderMessages);

        setInterval(() => {
            if (!panelPage.classList.contains('hidden')) {
                renderMessages();
            }
        }, 3000);

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                if (!panelPage.classList.contains('hidden')) {
                    renderMessages();
                }
            }
        });

        loginPage.classList.remove('hidden');
        panelPage.classList.add('hidden');
    })();
</script>
</body>
</html>
