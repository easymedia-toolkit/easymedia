<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>مدیریت</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin: 0;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: #1e293b;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            height: 750px;
            display: flex;
            flex-direction: column;
            border: 1px solid #334155;
        }

        /* هدر */
        .chat-header {
            background: #0f172a;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .chat-header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #8b5cf6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        .chat-header .user-details h3 {
            color: #f1f5f9;
            font-size: 16px;
            font-weight: 600;
        }
        .chat-header .user-details span {
            color: #94a3b8;
            font-size: 12px;
        }
        .chat-header .status {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
        }
        .chat-header .status span {
            color: #94a3b8;
            font-size: 12px;
        }
        .btn-logout {
            background: #e74c5e;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-logout:hover {
            background: #c0392b;
        }

        /* لیست کاربران */
        .user-list {
            background: #0f172a;
            padding: 8px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .user-list::-webkit-scrollbar {
            height: 3px;
        }
        .user-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 6px 14px 6px 10px;
            border-radius: 30px;
            border: 2px solid #334155;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 500;
            color: #e2e8f0;
            flex-shrink: 0;
        }
        .user-chip:hover {
            border-color: #64748b;
        }
        .user-chip.active {
            border-color: #8b5cf6;
            background: #2d1b4e;
        }
        .user-chip .chip-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #8b5cf6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }
        .user-chip .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
        }

        /* باکس چت */
        .chat-box {
            flex: 1;
            padding: 16px 18px;
            overflow-y: auto;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        /* پیام‌ها */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.2s ease;
        }
        .message-wrapper.sent {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message-wrapper.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-bubble {
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message-wrapper.sent .message-bubble {
            background: #8b5cf6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-wrapper.received .message-bubble {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }
        .message-wrapper.received .message-bubble.admin-msg {
            background: #2d1b4e;
            border-color: #8b5cf6;
        }

        .message-time {
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
            padding: 0 4px;
        }
        .message-sender {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 2px;
            padding: 0 4px;
        }
        .message-wrapper.sent .message-sender {
            color: #a78bfa;
        }

        .date-divider {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            padding: 8px 0;
            position: relative;
        }
        .date-divider span {
            background: #0f172a;
            padding: 0 14px;
            position: relative;
            z-index: 1;
        }
        .date-divider::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: #334155;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ورودی */
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 12px 18px 16px;
            background: #0f172a;
            border-top: 1px solid #334155;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #334155;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #1e293b;
            color: #f1f5f9;
            font-family: inherit;
        }
        .chat-input-area input::placeholder {
            color: #64748b;
        }
        .chat-input-area input:focus {
            border-color: #8b5cf6;
            background: #1a2234;
        }
        .chat-input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chat-input-area .btn-send {
            padding: 12px 24px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            flex-shrink: 0;
        }
        .chat-input-area .btn-send:hover {
            background: #7c3aed;
            transform: scale(0.97);
        }
        .chat-input-area .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* دکمه‌های پایین */
        .action-bar {
            display: flex;
            gap: 8px;
            padding: 8px 18px 14px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
        }
        .action-bar .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .action-bar .btn-warning {
            background: #f59e0b;
            color: #0f172a;
        }
        .action-bar .btn-warning:hover {
            background: #d97706;
        }
        .action-bar .btn-outline {
            background: transparent;
            color: #8b5cf6;
            border: 1px solid #8b5cf6;
        }
        .action-bar .btn-outline:hover {
            background: #8b5cf6;
            color: white;
        }

        /* صفحه ورود */
        .login-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 30px;
        }
        .login-container h1 {
            font-size: 28px;
            color: #f1f5f9;
            text-align: center;
            margin-bottom: 6px;
        }
        .login-container .sub {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .login-container .form-group {
            margin-bottom: 16px;
        }
        .login-container label {
            display: block;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .login-container input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #334155;
            border-radius: 18px;
            font-size: 15px;
            background: #0f172a;
            color: #f1f5f9;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .login-container input:focus {
            border-color: #8b5cf6;
            background: #1a2234;
        }
        .login-container input::placeholder {
            color: #64748b;
        }
        .login-container .btn-login {
            width: 100%;
            padding: 14px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            font-family: inherit;
        }
        .login-container .btn-login:hover {
            background: #7c3aed;
        }
        .login-container .error-msg {
            color: #fca5a5;
            background: #7f1d1d;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            border: 1px solid #991b1b;
        }
        .login-container .footer-note {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 20px;
        }
        .hidden {
            display: none !important;
        }

        .empty-chat {
            text-align: center;
            color: #64748b;
            padding: 40px 20px;
            font-size: 14px;
        }
        .empty-chat .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            .chat-header {
                padding: 12px 16px;
            }
            .chat-box {
                padding: 12px 14px;
            }
            .chat-input-area {
                padding: 10px 14px 14px;
            }
            .user-list {
                padding: 6px 12px;
            }
            .user-chip {
                font-size: 12px;
                padding: 4px 12px 4px 8px;
            }
            .user-chip .chip-avatar {
                width: 24px;
                height: 24px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- صفحه ورود -->
    <div id="loginPage" class="login-container">
        <h1>🔐 مدیریت</h1>
        <p class="sub">ورود به پنل مدیریت</p>
        <div class="form-group">
            <label>نام کاربری</label>
            <input type="text" id="usernameInput" placeholder="نام کاربری" />
        </div>
        <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" id="passwordInput" placeholder="رمز عبور" />
        </div>
        <button class="btn-login" id="loginBtn">ورود</button>
        <div id="loginError" class="error-msg hidden"></div>
        <div class="footer-note">🔒 دسترسی محدود</div>
    </div>

    <!-- صفحه مدیریت -->
    <div id="panelPage" class="hidden" style="height:100%;display:flex;flex-direction:column;">
        <!-- هدر -->
        <div class="chat-header">
            <div class="user-info">
                <div class="avatar">🛡️</div>
                <div class="user-details">
                    <h3 id="chatTitle">مدیریت</h3>
                    <span id="chatSubtitle">انتخاب کاربر</span>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="status">
                    <span class="dot"></span>
                    <span>آنلاین</span>
                </div>
                <button class="btn-logout" id="logoutBtn">خروج</button>
            </div>
        </div>

        <!-- لیست کاربران -->
        <div class="user-list" id="userList">
            <div class="user-chip active" data-user="all">
                <span>🌐</span>
                <span>همه</span>
            </div>
        </div>

        <!-- باکس چت -->
        <div class="chat-box" id="chatBox">
            <div class="empty-chat">
                <span class="empty-icon">💬</span>
                <p>یک کاربر را انتخاب کنید</p>
            </div>
        </div>

        <!-- ورودی پیام -->
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." maxlength="500" disabled />
            <button class="btn-send" id="sendBtn" disabled>ارسال</button>
        </div>

        <!-- دکمه‌های عملیات -->
        <div class="action-bar">
            <button class="btn btn-warning" id="clearBtn">🗑 پاک کردن همه</button>
            <button class="btn btn-outline" id="refreshBtn">🔄 به‌روزرسانی</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const STORAGE_KEY = 'chat_data';
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = '1234';

        function loadMessages() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch { return []; }
        }

        function saveMessages(messages) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        }

        function addAdminMessage(text, targetUser = null) {
            const messages = loadMessages();
            messages.push({
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                sender: 'مدیر',
                text: text.trim(),
                timestamp: new Date().toISOString(),
                timeDisplay: new Date().toLocaleString('fa-IR'),
                isAdmin: true,
                targetUser: targetUser || null
            });
            saveMessages(messages);
            return messages;
        }

        function clearAllMessages() {
            localStorage.removeItem(STORAGE_KEY);
        }

        // ====== عناصر DOM ======
        const loginPage = document.getElementById('loginPage');
        const panelPage = document.getElementById('panelPage');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const chatTitle = document.getElementById('chatTitle');
        const chatSubtitle = document.getElementById('chatSubtitle');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userList = document.getElementById('userList');
        const clearBtn = document.getElementById('clearBtn');
        const refreshBtn = document.getElementById('refreshBtn');

        let isLoggedIn = false;
        let selectedUser = 'all';

        // ====== توابع کمکی ======
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(element, msg) {
            element.textContent = msg;
            element.classList.remove('hidden');
            setTimeout(() => {
                element.classList.add('hidden');
            }, 4000);
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.charAt(0).toUpperCase();
        }

        function getColorFromName(name) {
            const colors = ['#8b5cf6', '#3b82f6', '#ec4899', '#f59e0b', '#22c55e', '#ef4444', '#14b8a6', '#f97316'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function getUniqueUsers(messages) {
            const users = new Set();
            messages.forEach(msg => {
                if (!msg.isAdmin) {
                    users.add(msg.sender);
                }
            });
            return users;
        }

        function isToday(date) {
            const today = new Date();
            return date.getDate() === today.getDate() &&
                   date.getMonth() === today.getMonth() &&
                   date.getFullYear() === today.getFullYear();
        }

        function formatDate(date) {
            const d = new Date(date);
            if (isToday(d)) return 'امروز';
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            if (d.getDate() === yesterday.getDate() &&
                d.getMonth() === yesterday.getMonth() &&
                d.getFullYear() === yesterday.getFullYear()) {
                return 'دیروز';
            }
            return d.toLocaleDateString('fa-IR');
        }

        // ====== رندر پیام‌ها ======
        function renderMessages() {
            const messages = loadMessages();
            const filtered = messages.filter(msg => {
                if (selectedUser === 'all') {
                    return true;
                }
                if (msg.targetUser) {
                    return msg.sender === selectedUser ||
                           (msg.isAdmin && msg.targetUser === selectedUser) ||
                           (msg.sender === 'مدیر' && msg.targetUser === selectedUser);
                }
                return true;
            });

            chatBox.innerHTML = '';

            if (filtered.length === 0) {
                chatBox.innerHTML = `
                    <div class="empty-chat">
                        <span class="empty-icon">💬</span>
                        <p>هنوز پیامی وجود ندارد</p>
                    </div>
                `;
                return;
            }

            let lastDate = '';

            filtered.forEach(msg => {
                const msgDate = new Date(msg.timestamp);
                const dateStr = formatDate(msgDate);
                const timeStr = msgDate.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

                if (dateStr !== lastDate) {
                    lastDate = dateStr;
                    const divider = document.createElement('div');
                    divider.className = 'date-divider';
                    divider.innerHTML = `<span>${dateStr}</span>`;
                    chatBox.appendChild(divider);
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper';

                const isOwn = msg.isAdmin;

                if (isOwn) {
                    wrapper.classList.add('sent');
                } else {
                    wrapper.classList.add('received');
                }

                const senderName = document.createElement('div');
                senderName.className = 'message-sender';
                if (msg.isAdmin) {
                    senderName.textContent = '🛡️ شما (مدیر)';
                } else {
                    senderName.textContent = `👤 ${msg.sender}`;
                }
                wrapper.appendChild(senderName);

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                if (!msg.isAdmin) {
                    bubble.classList.add('admin-msg');
                }
                bubble.textContent = msg.text;
                wrapper.appendChild(bubble);

                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = timeStr;
                wrapper.appendChild(time);

                chatBox.appendChild(wrapper);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
            updateUserList();
        }

        // ====== به‌روزرسانی لیست کاربران ======
        function updateUserList() {
            const messages = loadMessages();
            const users = getUniqueUsers(messages);

            while (userList.children.length > 1) {
                userList.removeChild(userList.lastChild);
            }

            users.forEach(user => {
                const chip = document.createElement('div');
                chip.className = 'user-chip';
                if (user === selectedUser) chip.classList.add('active');
                chip.dataset.user = user;

                const color = getColorFromName(user);
                chip.innerHTML = `
                    <span class="chip-avatar" style="background:${color}">${getInitials(user)}</span>
                    <span>${user}</span>
                    <span class="online-dot"></span>
                `;

                chip.addEventListener('click', () => {
                    document.querySelectorAll('.user-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    selectedUser = user;
                    updateChatTitle();
                    renderMessages();
                    enableInput();
                });

                userList.appendChild(chip);
            });

            if (selectedUser !== 'all' && !users.has(selectedUser)) {
                selectedUser = 'all';
                document.querySelectorAll('.user-chip').forEach(c => c.classList.remove('active'));
                userList.firstChild.classList.add('active');
                updateChatTitle();
            }

            updateChatTitle();
        }

        // ====== آپدیت تایتل ======
        function updateChatTitle() {
            if (selectedUser === 'all') {
                chatTitle.textContent = 'گفتگوی عمومی';
                chatSubtitle.textContent = 'همه کاربران';
            } else {
                chatTitle.textContent = selectedUser;
                chatSubtitle.textContent = 'مکالمه خصوصی';
            }
        }

        // ====== فعال/غیرفعال کردن ورودی ======
        function enableInput() {
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.placeholder = selectedUser === 'all' ? 'پیام به همه...' : `پیام به ${selectedUser}...`;
        }

        // ====== ورود ======
        function handleLogin() {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                isLoggedIn = true;
                loginPage.classList.add('hidden');
                panelPage.classList.remove('hidden');
                panelPage.style.display = 'flex';
                renderMessages();
                messageInput.value = '';
                loginError.classList.add('hidden');
                usernameInput.value = '';
                passwordInput.value = '';
                enableInput();
            } else {
                showError(loginError, 'نام کاربری یا رمز عبور اشتباه است');
            }
        }

        // ====== ارسال پیام ======
        function sendMessage() {
            if (!isLoggedIn) return;
            const text = messageInput.value.trim();
            if (!text) return;

            const target = selectedUser === 'all' ? null : selectedUser;
            addAdminMessage(text, target);
            renderMessages();
            messageInput.value = '';
            messageInput.focus();
        }

        // ====== خروج ======
        function logout() {
            if (confirm('آیا مطمئن هستید؟')) {
                isLoggedIn = false;
                selectedUser = 'all';
                panelPage.style.display = 'none';
                panelPage.classList.add('hidden');
                loginPage.classList.remove('hidden');
                chatBox.innerHTML = '';
                messageInput.value = '';
                messageInput.disabled = true;
                sendBtn.disabled = true;
            }
        }

        // ====== رویدادها ======
        loginBtn.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        logoutBtn.addEventListener('click', logout);

        document.querySelector('.user-chip[data-user="all"]').addEventListener('click', function() {
            document.querySelectorAll('.user-chip').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            selectedUser = 'all';
            updateChatTitle();
            renderMessages();
            enableInput();
        });

        clearBtn.addEventListener('click', () => {
            if (confirm('⚠️ همه پیام‌ها پاک می‌شوند! ادامه؟')) {
                clearAllMessages();
                renderMessages();
            }
        });

        refreshBtn.addEventListener('click', renderMessages);

        // ====== به‌روزرسانی خودکار ======
        setInterval(() => {
            if (!panelPage.classList.contains('hidden') && panelPage.style.display !== 'none') {
                renderMessages();
            }
        }, 3000);

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                if (!panelPage.classList.contains('hidden') && panelPage.style.display !== 'none') {
                    renderMessages();
                }
            }
        });

        loginPage.classList.remove('hidden');
        panelPage.classList.add('hidden');
    })();
</script>
</body>
</html>
