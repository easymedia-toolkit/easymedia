<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>مدیریت</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin: 0;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #1e293b;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            height: 750px;
            display: flex;
            flex-direction: row;
            border: 1px solid #334155;
        }

        /* ====== سایدبار (لیست کاربران) ====== */
        .sidebar {
            width: 300px;
            background: #0f172a;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px 20px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h2 {
            color: #f1f5f9;
            font-size: 18px;
            font-weight: 600;
        }
        .sidebar-header .badge-count {
            background: #8b5cf6;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .sidebar-header .btn-logout-small {
            background: #e74c5e;
            color: white;
            border: none;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }
        .sidebar-header .btn-logout-small:hover {
            background: #c0392b;
        }

        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 0;
        }
        .user-list::-webkit-scrollbar {
            width: 4px;
        }
        .user-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 1px solid #1a2234;
        }
        .user-item:hover {
            background: #1e293b;
        }
        .user-item.active {
            background: #2d1b4e;
            border-left: 3px solid #8b5cf6;
        }
        .user-item .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
        }
        .user-item .user-info {
            flex: 1;
            min-width: 0;
        }
        .user-item .user-info .name {
            color: #f1f5f9;
            font-size: 14px;
            font-weight: 500;
        }
        .user-item .user-info .last-msg {
            color: #94a3b8;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-item .user-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }
        .user-item .user-meta .time {
            color: #64748b;
            font-size: 10px;
        }
        .user-item .user-meta .unread {
            background: #8b5cf6;
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            min-width: 20px;
            text-align: center;
        }
        .user-item .online-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            flex-shrink: 0;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ====== بخش چت ====== */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f172a;
            min-width: 0;
        }

        .chat-header {
            padding: 14px 20px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        .chat-header .user-details h3 {
            color: #f1f5f9;
            font-size: 15px;
            font-weight: 600;
        }
        .chat-header .user-details span {
            color: #94a3b8;
            font-size: 12px;
        }
        .chat-header .status {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header .status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        .chat-header .status span {
            color: #94a3b8;
            font-size: 12px;
        }

        .chat-box {
            flex: 1;
            padding: 16px 18px;
            overflow-y: auto;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-box::-webkit-scrollbar {
            width: 4px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.25s ease;
        }
        .message-wrapper.sent {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message-wrapper.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-bubble {
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message-wrapper.sent .message-bubble {
            background: #8b5cf6;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-wrapper.received .message-bubble {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
            padding: 0 4px;
        }
        .message-sender {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 2px;
            padding: 0 4px;
        }
        .message-wrapper.sent .message-sender {
            color: #a78bfa;
        }

        .date-divider {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            padding: 10px 0 6px;
            position: relative;
        }
        .date-divider span {
            background: #0f172a;
            padding: 0 14px;
            position: relative;
            z-index: 1;
            font-size: 12px;
        }
        .date-divider::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: #334155;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-chat {
            text-align: center;
            color: #64748b;
            padding: 50px 20px;
            font-size: 14px;
        }
        .empty-chat .empty-icon {
            font-size: 52px;
            margin-bottom: 14px;
            display: block;
        }
        .empty-chat .empty-sub {
            font-size: 12px;
            color: #475569;
            margin-top: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 12px 18px 16px;
            background: #0f172a;
            border-top: 1px solid #334155;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #334155;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #1e293b;
            color: #f1f5f9;
            font-family: inherit;
        }
        .chat-input-area input::placeholder {
            color: #64748b;
        }
        .chat-input-area input:focus {
            border-color: #8b5cf6;
            background: #1a2234;
        }
        .chat-input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chat-input-area .btn-send {
            padding: 12px 24px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            flex-shrink: 0;
        }
        .chat-input-area .btn-send:hover {
            background: #7c3aed;
            transform: scale(0.97);
        }
        .chat-input-area .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-bar {
            display: flex;
            gap: 8px;
            padding: 6px 18px 12px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            flex-shrink: 0;
        }
        .action-bar .btn {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .action-bar .btn-warning {
            background: #f59e0b;
            color: #0f172a;
        }
        .action-bar .btn-warning:hover {
            background: #d97706;
        }
        .action-bar .btn-outline {
            background: transparent;
            color: #8b5cf6;
            border: 1px solid #8b5cf6;
        }
        .action-bar .btn-outline:hover {
            background: #8b5cf6;
            color: white;
        }

        /* ====== صفحه ورود ====== */
        .login-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            background: #1e293b;
        }
        .login-container h1 {
            font-size: 28px;
            color: #f1f5f9;
            text-align: center;
            margin-bottom: 6px;
        }
        .login-container .sub {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .login-container .form-group {
            width: 100%;
            max-width: 360px;
            margin-bottom: 16px;
        }
        .login-container label {
            display: block;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .login-container input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #334155;
            border-radius: 18px;
            font-size: 15px;
            background: #0f172a;
            color: #f1f5f9;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .login-container input:focus {
            border-color: #8b5cf6;
            background: #1a2234;
        }
        .login-container input::placeholder {
            color: #64748b;
        }
        .login-container .btn-login {
            width: 100%;
            max-width: 360px;
            padding: 14px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
            font-family: inherit;
        }
        .login-container .btn-login:hover {
            background: #7c3aed;
        }
        .login-container .error-msg {
            color: #fca5a5;
            background: #7f1d1d;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            border: 1px solid #991b1b;
            max-width: 360px;
            width: 100%;
        }
        .login-container .footer-note {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 20px;
        }
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 45%;
                border-right: none;
                border-bottom: 1px solid #334155;
            }
            .chat-section {
                height: 55%;
            }
            .sidebar-header {
                padding: 12px 16px;
            }
            .user-item {
                padding: 10px 16px;
            }
            .chat-header {
                padding: 10px 16px;
            }
            .chat-box {
                padding: 12px 14px;
            }
            .chat-input-area {
                padding: 10px 14px 14px;
            }
        }
        @media (max-width: 500px) {
            .user-item .user-info .last-msg {
                max-width: 120px;
            }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- صفحه ورود -->
    <div id="loginPage" class="login-container">
        <h1>🔐 مدیریت</h1>
        <p class="sub">ورود به پنل مدیریت</p>
        <div class="form-group">
            <label>نام کاربری</label>
            <input type="text" id="usernameInput" placeholder="نام کاربری" />
        </div>
        <div class="form-group">
            <label>رمز عبور</label>
            <input type="password" id="passwordInput" placeholder="رمز عبور" />
        </div>
        <button class="btn-login" id="loginBtn">ورود</button>
        <div id="loginError" class="error-msg hidden"></div>
        <div class="footer-note">🔒 دسترسی محدود</div>
    </div>

    <!-- صفحه مدیریت -->
    <div id="panelPage" class="hidden" style="width:100%;height:100%;display:flex;flex-direction:row;">
        <!-- سایدبار -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="display:flex;align-items:center;gap:10px;">
                    <h2>💬 پیام‌ها</h2>
                    <span class="badge-count" id="totalUsers">0</span>
                </div>
                <button class="btn-logout-small" id="logoutBtn">خروج</button>
            </div>
            <div class="user-list" id="userList">
                <!-- کاربران توسط JS ساخته می‌شوند -->
            </div>
        </div>

        <!-- بخش چت -->
        <div class="chat-section">
            <!-- هدر چت -->
            <div class="chat-header" id="chatHeader">
                <div class="user-info">
                    <div class="avatar" id="chatAvatar" style="background:#8b5cf6;">🛡️</div>
                    <div class="user-details">
                        <h3 id="chatTitle">انتخاب کاربر</h3>
                        <span id="chatSubtitle">از لیست سمت راست انتخاب کنید</span>
                    </div>
                </div>
                <div class="status">
                    <span class="dot"></span>
                    <span>آنلاین</span>
                </div>
            </div>

            <!-- باکس چت -->
            <div class="chat-box" id="chatBox">
                <div class="empty-chat">
                    <span class="empty-icon">👈</span>
                    <p>یک کاربر را انتخاب کنید</p>
                    <div class="empty-sub">از لیست سمت راست کاربر مورد نظر را انتخاب کنید</div>
                </div>
            </div>

            <!-- ورودی پیام -->
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="پیام خود را بنویسید..." maxlength="500" disabled />
                <button class="btn-send" id="sendBtn" disabled>ارسال</button>
            </div>

            <!-- دکمه‌های عملیات -->
            <div class="action-bar">
                <button class="btn btn-warning" id="clearBtn">🗑 پاک کردن همه</button>
                <button class="btn btn-outline" id="refreshBtn">🔄 به‌روزرسانی</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const STORAGE_KEY = 'chat_data';
        const ADMIN_USER = 'admin';
        const ADMIN_PASS = '1234';

        let isLoggedIn = false;
        let selectedUser = null; // نام کاربر انتخاب شده

        // ====== مدیریت پیام‌ها ======
        function loadMessages() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch { return []; }
        }

        function saveMessages(messages) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        }

        function addAdminMessage(text, targetUser) {
            const messages = loadMessages();
            messages.push({
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                sender: 'مدیر',
                text: text.trim(),
                timestamp: new Date().toISOString(),
                timeDisplay: new Date().toLocaleString('fa-IR'),
                isAdmin: true
            });
            saveMessages(messages);
            return messages;
        }

        function clearAllMessages() {
            localStorage.removeItem(STORAGE_KEY);
        }

        // ====== توابع کمکی ======
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showError(element, msg) {
            element.textContent = msg;
            element.classList.remove('hidden');
            setTimeout(() => {
                element.classList.add('hidden');
            }, 4000);
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.charAt(0).toUpperCase();
        }

        function getColorFromName(name) {
            const colors = ['#8b5cf6', '#3b82f6', '#ec4899', '#f59e0b', '#22c55e', '#ef4444', '#14b8a6', '#f97316'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function getUniqueUsers(messages) {
            const users = new Set();
            messages.forEach(msg => {
                if (!msg.isAdmin) {
                    users.add(msg.sender);
                }
            });
            return users;
        }

        function getLastMessageForUser(messages, username) {
            const userMsgs = messages.filter(m => m.sender === username || m.isAdmin);
            if (userMsgs.length === 0) return null;
            return userMsgs[userMsgs.length - 1];
        }

        function getUnreadCount(messages, username) {
            // ساده: تعداد پیام‌های کاربر که پاسخ داده نشده
            const userMsgs = messages.filter(m => m.sender === username && !m.isAdmin);
            const adminReplies = messages.filter(m => m.isAdmin);
            // اگر آخرین پیام از ادمین باشد، یعنی پاسخ داده شده
            const lastMsg = messages.filter(m => m.sender === username || m.isAdmin);
            if (lastMsg.length === 0) return 0;
            const last = lastMsg[lastMsg.length - 1];
            if (last.isAdmin) return 0;
            // شمارش پیام‌های بدون پاسخ
            let count = 0;
            let hasReply = false;
            for (let i = messages.length - 1; i >= 0; i--) {
                if (messages[i].sender === username && !messages[i].isAdmin) {
                    if (!hasReply) count++;
                }
                if (messages[i].isAdmin) {
                    hasReply = true;
                }
            }
            return count;
        }

        function isToday(date) {
            const today = new Date();
            return date.getDate() === today.getDate() &&
                   date.getMonth() === today.getMonth() &&
                   date.getFullYear() === today.getFullYear();
        }

        function formatDate(date) {
            const d = new Date(date);
            if (isToday(d)) return 'امروز';
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            if (d.getDate() === yesterday.getDate() &&
                d.getMonth() === yesterday.getMonth() &&
                d.getFullYear() === yesterday.getFullYear()) {
                return 'دیروز';
            }
            return d.toLocaleDateString('fa-IR');
        }

        // ====== عناصر DOM ======
        const loginPage = document.getElementById('loginPage');
        const panelPage = document.getElementById('panelPage');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const userList = document.getElementById('userList');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatTitle = document.getElementById('chatTitle');
        const chatSubtitle = document.getElementById('chatSubtitle');
        const chatAvatar = document.getElementById('chatAvatar');
        const clearBtn = document.getElementById('clearBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const totalUsers = document.getElementById('totalUsers');

        // ====== رندر لیست کاربران ======
        function renderUserList() {
            const messages = loadMessages();
            const users = getUniqueUsers(messages);
            totalUsers.textContent = users.size;

            userList.innerHTML = '';

            if (users.size === 0) {
                userList.innerHTML = `
                    <div style="text-align:center;color:#64748b;padding:30px 20px;font-size:13px;">
                        <div style="font-size:32px;margin-bottom:8px;">👤</div>
                        هنوز کاربری ثبت نشده است
                    </div>
                `;
                return;
            }

            users.forEach(user => {
                const item = document.createElement('div');
                item.className = 'user-item';
                if (selectedUser === user) item.classList.add('active');

                const color = getColorFromName(user);
                const lastMsg = getLastMessageForUser(messages, user);
                const unread = getUnreadCount(messages, user);

                item.innerHTML = `
                    <div class="user-avatar" style="background:${color}">${getInitials(user)}</div>
                    <div class="user-info">
                        <div class="name">${user}</div>
                        <div class="last-msg">${lastMsg ? escapeHtml(lastMsg.text) : 'بدون پیام'}</div>
                    </div>
                    <div class="user-meta">
                        <div class="time">${lastMsg ? new Date(lastMsg.timestamp).toLocaleTimeString('fa-IR', {hour:'2-digit',minute:'2-digit'}) : ''}</div>
                        ${unread > 0 ? `<div class="unread">${unread}</div>` : ''}
                        <span class="online-dot"></span>
                    </div>
                `;

                item.addEventListener('click', () => {
                    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    selectedUser = user;
                    updateChatHeader();
                    renderMessages();
                    enableInput();
                });

                userList.appendChild(item);
            });
        }

        // ====== آپدیت هدر چت ======
        function updateChatHeader() {
            if (selectedUser) {
                const color = getColorFromName(selectedUser);
                chatTitle.textContent = selectedUser;
                chatSubtitle.textContent = 'مکالمه خصوصی';
                chatAvatar.textContent = getInitials(selectedUser);
                chatAvatar.style.background = color;
            } else {
                chatTitle.textContent = 'انتخاب کاربر';
                chatSubtitle.textContent = 'از لیست سمت راست انتخاب کنید';
                chatAvatar.textContent = '🛡️';
                chatAvatar.style.background = '#8b5cf6';
            }
        }

        // ====== رندر پیام‌ها ======
        function renderMessages() {
            const messages = loadMessages();
            
            let filtered = [];
            if (selectedUser) {
                filtered = messages.filter(msg => {
                    return msg.sender === selectedUser || msg.isAdmin === true;
                });
            }

            chatBox.innerHTML = '';

            if (!selectedUser) {
                chatBox.innerHTML = `
                    <div class="empty-chat">
                        <span class="empty-icon">👈</span>
                        <p>یک کاربر را انتخاب کنید</p>
                        <div class="empty-sub">از لیست سمت راست کاربر مورد نظر را انتخاب کنید</div>
                    </div>
                `;
                return;
            }

            if (filtered.length === 0) {
                chatBox.innerHTML = `
                    <div class="empty-chat">
                        <span class="empty-icon">💬</span>
                        <p>هیچ پیامی با ${selectedUser} وجود ندارد</p>
                        <div class="empty-sub">اولین پیام را ارسال کنید</div>
                    </div>
                `;
                return;
            }

            let lastDate = '';

            filtered.forEach(msg => {
                const msgDate = new Date(msg.timestamp);
                const dateStr = formatDate(msgDate);
                const timeStr = msgDate.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

                if (dateStr !== lastDate) {
                    lastDate = dateStr;
                    const divider = document.createElement('div');
                    divider.className = 'date-divider';
                    divider.innerHTML = `<span>${dateStr}</span>`;
                    chatBox.appendChild(divider);
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper';

                const isOwn = msg.isAdmin;

                if (isOwn) {
                    wrapper.classList.add('sent');
                } else {
                    wrapper.classList.add('received');
                }

                const senderName = document.createElement('div');
                senderName.className = 'message-sender';
                if (msg.isAdmin) {
                    senderName.textContent = '🛡️ شما (مدیر)';
                } else {
                    senderName.textContent = `👤 ${msg.sender}`;
                }
                wrapper.appendChild(senderName);

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = msg.text;
                wrapper.appendChild(bubble);

                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = timeStr;
                wrapper.appendChild(time);

                chatBox.appendChild(wrapper);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
            renderUserList();
        }

        // ====== فعال/غیرفعال کردن ورودی ======
        function enableInput() {
            if (selectedUser) {
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.placeholder = `پیام به ${selectedUser}...`;
            } else {
                messageInput.disabled = true;
                sendBtn.disabled = true;
                messageInput.placeholder = 'ابتدا کاربر را انتخاب کنید';
            }
        }

        // ====== ورود ======
        function handleLogin() {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();

            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                isLoggedIn = true;
                loginPage.classList.add('hidden');
                panelPage.classList.remove('hidden');
                panelPage.style.display = 'flex';
                selectedUser = null;
                renderUserList();
                renderMessages();
                updateChatHeader();
                enableInput();
                messageInput.value = '';
                loginError.classList.add('hidden');
                usernameInput.value = '';
                passwordInput.value = '';
            } else {
                showError(loginError, 'نام کاربری یا رمز عبور اشتباه است');
            }
        }

        // ====== ارسال پیام ======
        function sendMessage() {
            if (!isLoggedIn || !selectedUser) return;
            const text = messageInput.value.trim();
            if (!text) return;

            addAdminMessage(text, selectedUser);
            renderMessages();
            messageInput.value = '';
            messageInput.focus();
        }

        // ====== خروج ======
        function logout() {
            if (confirm('آیا مطمئن هستید؟')) {
                isLoggedIn = false;
                selectedUser = null;
                panelPage.style.display = 'none';
                panelPage.classList.add('hidden');
                loginPage.classList.remove('hidden');
                chatBox.innerHTML = '';
                messageInput.value = '';
                messageInput.disabled = true;
                sendBtn.disabled = true;
                userList.innerHTML = '';
            }
        }

        // ====== رویدادها ======
        loginBtn.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        logoutBtn.addEventListener('click', logout);

        clearBtn.addEventListener('click', () => {
            if (confirm('⚠️ همه پیام‌ها پاک می‌شوند! ادامه؟')) {
                clearAllMessages();
                renderMessages();
                renderUserList();
            }
        });

        refreshBtn.addEventListener('click', () => {
            renderMessages();
            renderUserList();
        });

        // ====== به‌روزرسانی خودکار ======
        setInterval(() => {
            if (!panelPage.classList.contains('hidden') && panelPage.style.display !== 'none') {
                renderMessages();
                renderUserList();
            }
        }, 3000);

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                if (!panelPage.classList.contains('hidden') && panelPage.style.display !== 'none') {
                    renderMessages();
                    renderUserList();
                }
            }
        });

        loginPage.classList.remove('hidden');
        panelPage.classList.add('hidden');
    })();
</script>
</body>
</html>
